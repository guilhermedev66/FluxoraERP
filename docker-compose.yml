services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluxora}
      POSTGRES_USER: ${POSTGRES_USER:-fluxora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fluxora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluxora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Fluxora.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB:-fluxora};Username=${POSTGRES_USER:-fluxora};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-Fluxora}
      Jwt__Audience: ${JWT_AUDIENCE:-Fluxora}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-30}
      Database__ApplyMigrations: "true"
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}

volumes:
  fluxora_postgres_data:
