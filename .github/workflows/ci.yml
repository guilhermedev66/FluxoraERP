name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Fluxora.sln
      - name: Build
        run: dotnet build Fluxora.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Fluxora.UnitTests --configuration Release --no-build --no-restore
      - name: PostgreSQL integration tests
        run: dotnet test tests/Fluxora.IntegrationTests --configuration Release --no-build --no-restore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_IMAGE: fluxora-api:ci
      POSTGRES_PASSWORD: ci-deployment-smoke-only
      JWT_KEY: ci-deployment-smoke-signing-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - name: Build and start production-shaped Compose stack
        run: docker compose up -d --build
      - name: Verify liveness and PostgreSQL readiness
        run: ./scripts/smoke-test.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=200 api postgres
      - name: Remove disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
